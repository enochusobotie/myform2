<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer registration form</title>
</head>
<body style="background-color: rgb(103, 8, 8);">
    <header>
        <h1 style="color: blanchedalmond;">First Bank</h1><hr>
        <p style="color: blanchedalmond;">Welcome to First Bank customer service</p><hr>
    </header>
    <h1 style="color: blanchedalmond;">Customer Registration</h1>
    <form action="" style="color: blanchedalmond;">
        <label for="">Full Name</label><br>
        <input type="text" placeholder="Enter your full name">
        <br><br>
        <label for="">Email Address</label><br>
        <input type="email" placeholder="Enter your email">
        <br><br>
        <label for="">Phone Number</label><br>
        <input type="tel" placeholder="Enter your phone number">
        <br><br>
        <label for="">Choose Username</label><br>
        <input type="text" placeholder="Create a Username">
        <br><br>
        <label for="">Create Password</label><br>
        <input type="password" placeholder="Create a strong Password">
        <br><br>
        <label for="">Confirm Password</label><br>
        <input type="password" placeholder="Confirm Password">
        <br><br>
        <button type="submit">Register</button>
        <br>
        <a href="login.html" style="color: blanchedalmond;">Already have an account?Login here</a>

    </form>
</body>
</html>
